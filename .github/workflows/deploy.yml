name: Deploy

# Merging into main runs the full CI again, then triggers the Render backend deploy.
# The client is not deployed here: Vercel deploys it (previews and production) through its own
# Git integration.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  production:
    name: Deploy to production
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deploys never overlap and are never cancelled half way through.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
    steps:
      - name: Check Render secret
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing repository secret: RENDER_DEPLOY_HOOK_URL. See docs/ci-cd.md."
            exit 1
          fi
      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
